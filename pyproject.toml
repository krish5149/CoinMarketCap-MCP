[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "coinmarketcap-mcp"
version = "1.0.0"
description = "An MCP server for CoinMarketCap cryptocurrency and DEX data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "ruff>=0.5,<1.0",
]

[project.scripts]
coinmarketcap-mcp = "coinmarketcap_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coinmarketcap_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
